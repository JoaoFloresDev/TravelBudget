name: TravelBudget
options:
  bundleIdPrefix: com.gambitstudio
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: NZC6LC8NWM
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  GambitCoreKit:
    url: https://github.com/JoaoFloresDev/GambitCoreKit.git
    branch: main
  OnboardingKit:
    url: https://github.com/JoaoFloresDev/OnboardingKit.git
    branch: main

targets:
  TravelBudget:
    type: application
    platform: iOS
    sources:
      - path: TravelBudget
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "TravelBudget.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gambitstudio.travelbudget
        INFOPLIST_FILE: TravelBudget/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    entitlements:
      path: TravelBudget/TravelBudget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gambitstudio.travelbudget
    dependencies:
      - package: GambitCoreKit
      - package: OnboardingKit
      - target: TravelBudgetWidget
        embed: true

  TravelBudgetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TravelBudgetWidget
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "TravelBudgetWidget.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gambitstudio.travelbudget.widget
        INFOPLIST_FILE: TravelBudgetWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: NO
        SKIP_INSTALL: YES
    entitlements:
      path: TravelBudgetWidget/TravelBudgetWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gambitstudio.travelbudget

  TravelBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TravelBudgetTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gambitstudio.travelbudget.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TravelBudget
